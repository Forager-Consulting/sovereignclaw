# Kokoro — Sir Clawsalot's voice. Local text-to-speech (82M params) on the
# inference GPU, OpenAI-compatible /v1/audio/speech on port 8880. British voices: bm_*.
# Measured on an RTX 2080 SUPER, 88-word reply: ~1s and ~1.3 GiB VRAM
# (vs 18.6s on 8 CPU cores), so it shares the inference GPU with Ollama.
#
# Speech must never leave the castle: the NetworkPolicy below denies ALL
# outbound traffic (verified: the model and voices are baked into the image,
# so it starts and speaks fully offline) and admits inbound only from OpenClaw.
apiVersion: v1
kind: Namespace
metadata:
  name: kokoro
  labels:
    app.kubernetes.io/managed-by: argocd
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kokoro
  namespace: kokoro
  labels:
    app: kokoro
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kokoro
  template:
    metadata:
      labels:
        app: kokoro
    spec:
      runtimeClassName: nvidia
      nodeSelector:
        sovereignclaw.ai/gpu-inference: "true"
      containers:
        - name: kokoro
          image: ghcr.io/remsky/kokoro-fastapi-gpu:v0.9.0-cu128
          ports:
            - containerPort: 8880
              name: http
          env:
            - name: NVIDIA_VISIBLE_DEVICES
              value: "all"
            # Same non-display GPU as Ollama (ConfigMap written by bootstrap)
            - name: CUDA_DEVICE_ORDER
              value: "PCI_BUS_ID"
            - name: CUDA_VISIBLE_DEVICES
              valueFrom:
                configMapKeyRef:
                  name: sovereignclaw-gpu
                  key: inference-gpu
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 4Gi
          # TCP probes on purpose: while synthesising, Kokoro cannot answer HTTP
          # within a probe timeout, which marked it unready mid-sentence and
          # would have restarted it.
          readinessProbe:
            tcpSocket:
              port: 8880
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8880
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 5
---
apiVersion: v1
kind: Service
metadata:
  name: kokoro
  namespace: kokoro
  labels:
    app: kokoro
spec:
  type: ClusterIP
  selector:
    app: kokoro
  ports:
    - name: http
      port: 8880
      targetPort: 8880
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kokoro-sealed
  namespace: kokoro
spec:
  podSelector:
    matchLabels:
      app: kokoro
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openclaw
      ports:
        - port: 8880
  egress: []
